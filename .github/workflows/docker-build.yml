name: Docker Build and Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/capstone-enhancements
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - .github/workflows/docker-build.yml

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af
          echo "Disk space after cleanup"
          df -h

      - name: Build Docker image
        run: docker build -t operations-copilot:1.0 .

      - name: Validate Python dependencies
        run: docker run --rm operations-copilot:1.0 python -m pip check

      - name: Validate application syntax
        run: docker run --rm operations-copilot:1.0 python -m compileall -q /app/src /app/app

      - name: Inspect Docker image
        run: docker image inspect operations-copilot:1.0

      - name: Docker image details
        run: docker images operations-copilot


      - name: Start Docker container
        run: |
          docker run -d \
            --name operations-copilot \
            -p 127.0.0.1:8501:8501 \
            operations-copilot:1.0

      - name: Validate Streamlit health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              echo ""
              echo "SUCCESS: Streamlit server is running."
              exit 0
            fi

            echo "Checking container health..."
            sleep 5
          done

          echo "ERROR: Health check failed."
          exit 1

      - name: Validate application HTTP response
        run: |
          curl --fail --silent \
            http://localhost:8501/ \
            -o /tmp/streamlit-response.html

          echo "SUCCESS: Application HTTP endpoint accessible."

      - name: Check running container
        run: docker ps --filter name=operations-copilot

      - name: Capture application logs
        if: always()
        run: docker logs operations-copilot || true

      - name: Stop Docker container
        if: always()
        run: docker rm -f operations-copilot || true
